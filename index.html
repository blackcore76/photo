
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Vault</title>
<meta name="theme-color" content="#090c10">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
header{
  padding:20px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0d1117;
  border-bottom:1px solid #30363d;
}
h1{margin:0;font-size:1rem;letter-spacing:.08em}
.btn{
  background:#161b22;color:#fff;border:1px solid #30363d;
  padding:10px 14px;border-radius:12px;cursor:pointer
}
main{max-width:1100px;margin:auto;padding:24px}
.upload-box{display:none;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.comment-input{
  flex:1;min-width:180px;background:#111;color:#fff;
  border:1px solid #333;padding:10px 12px;border-radius:12px
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{
  background:#0b0b0b;border:1px solid rgba(255,255,255,.08);
  border-radius:20px;overflow:hidden
}
.card img{
  width:100%;aspect-ratio:4/5;object-fit:contain;
  background:#000;cursor:pointer;display:block
}
.meta{padding:12px}
.date{font-size:.75rem;color:#888;margin-bottom:8px}
.actions{display:flex;gap:8px;align-items:center;font-size:.85rem}
.pagination{display:flex;justify-content:center;gap:12px;margin-top:24px}
.lightbox{
  position:fixed;inset:0;display:none;justify-content:center;
  align-items:center;background:rgba(0,0,0,.94);padding:20px;z-index:999
}
.lightbox img{
  max-width:100%;max-height:100%;
  width:auto;height:auto;object-fit:contain;border-radius:18px
}
</style>
</head>
<body>

<header>
  <h1>MEMORY VAULT</h1>
  <button id="loginBtn" class="btn">Google 로그인</button>
</header>

<main>
  <div id="uploadBox" class="upload-box">
    <input id="fileInput" type="file" accept="image/*">
    <input id="commentInput" class="comment-input" maxlength="60" placeholder="짧은 코멘트">
    <button id="uploadBtn" class="btn">올리기</button>
  </div>

  <div id="gallery" class="grid"></div>

  <div class="pagination">
    <button id="prevBtn" class="btn">이전</button>
    <button id="nextBtn" class="btn">다음</button>
  </div>
</main>

<div id="lightbox" class="lightbox">
  <img id="lightboxImg">
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';
import { getFirestore, collection, addDoc, getDocs, orderBy, query, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCIQKMbhnQY2sIdDthFrm-dznnVMs5pb30",
  authDomain: "my-bp-tracker-3d595.firebaseapp.com",
  projectId: "my-bp-tracker-3d595",
  storageBucket: "my-bp-tracker-3d595.firebasestorage.app",
  appId: "1:1016360206319:web:5f5df2e2c45b30694a401a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let allPhotos = [];
let currentPage = 0;
const pageSize = 10;

const loginBtn = document.getElementById('loginBtn');
const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
const commentInput = document.getElementById('commentInput');
const uploadBtn = document.getElementById('uploadBtn');
const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

loginBtn.onclick = () => currentUser ? signOut(auth) : signInWithPopup(auth, provider);

onAuthStateChanged(auth, user => {
  currentUser = user;
  loginBtn.textContent = user ? '로그아웃' : 'Google 로그인';
  uploadBox.style.display = user ? 'flex' : 'none';
  loadGallery();
});

function makeThumbnail(file, maxSize = 500){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    const img = new Image();

    reader.onload = e => img.src = e.target.result;
    reader.onerror = reject;
    img.onerror = reject;

    img.onload = () => {
      let w = img.width;
      let h = img.height;

      if(w > h && w > maxSize){
        h *= maxSize / w;
        w = maxSize;
      } else if(h > maxSize){
        w *= maxSize / h;
        h = maxSize;
      }

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);

      canvas.toBlob(blob => {
        if(blob) resolve(blob);
        else reject('thumbnail fail');
      }, 'image/jpeg', 0.8);
    };

    reader.readAsDataURL(file);
  });
}

uploadBtn.onclick = async () => {
  const file = fileInput.files[0];
  if(!file || !currentUser) return;

  try{
    const id = Date.now();
    const originalRef = ref(storage, `photos/${id}_${file.name}`);
    await uploadBytes(originalRef, file);
    const url = await getDownloadURL(originalRef);

    let thumbUrl = null;
    let thumbPath = null;

    try{
      const thumbBlob = await makeThumbnail(file);
      const thumbRef = ref(storage, `thumbs/${id}_${file.name}`);
      await uploadBytes(thumbRef, thumbBlob);
      thumbUrl = await getDownloadURL(thumbRef);
      thumbPath = thumbRef.fullPath;
    }catch(e){
      console.warn('썸네일 생성 실패:', e);
    }

    await addDoc(collection(db,'photos'),{
      url,
      thumbUrl,
      pathOriginal: originalRef.fullPath,
      pathThumb: thumbPath,
      comment: commentInput.value.trim(),
      createdAt: Date.now(),
      ownerUid: currentUser.uid
    });

    fileInput.value = '';
    commentInput.value = '';
    loadGallery();

  }catch(err){
    alert('업로드 중 오류가 발생했습니다.');
    console.error(err);
  }
};

async function loadGallery(){
  const q = query(collection(db,'photos'), orderBy('createdAt','desc'));
  const snap = await getDocs(q);
  allPhotos = snap.docs.map(d => ({id:d.id, ...d.data()}));
  renderPage();
}

function renderPage(){
  gallery.innerHTML = '';
  const start = currentPage * pageSize;
  const items = allPhotos.slice(start, start + pageSize);

  items.forEach(data => {
    const canEdit = currentUser && currentUser.uid === data.ownerUid;
    const preview = data.thumbUrl || data.url;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${preview}" alt="">
      <div class="meta">
        <div class="date">${new Date(data.createdAt).toLocaleDateString('ko-KR')}</div>
        <div class="actions">
          ${canEdit ? '<button class="btn delete-btn">삭제</button>' : ''}
          <span>${data.comment || ''}</span>
        </div>
      </div>
    `;

    card.querySelector('img').onclick = () => {
      lightboxImg.src = data.url;
      lightbox.style.display = 'flex';
    };

    if(canEdit){
      card.querySelector('.delete-btn').onclick = async () => {
        await deleteObject(ref(storage, data.pathOriginal));
        if(data.pathThumb){
          try{ await deleteObject(ref(storage, data.pathThumb)); }catch(e){}
        }
        await deleteDoc(doc(db,'photos',data.id));
        loadGallery();
      };
    }

    gallery.appendChild(card);
  });
}

document.getElementById('prevBtn').onclick = () => {
  if(currentPage > 0){
    currentPage--;
    renderPage();
  }
};

document.getElementById('nextBtn').onclick = () => {
  if((currentPage + 1) * pageSize < allPhotos.length){
    currentPage++;
    renderPage();
  }
};

lightbox.onclick = () => lightbox.style.display = 'none';
</script>

</body>
</html>
